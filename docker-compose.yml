version: "3.9"

services:
  # Service database quan hệ: PostgreSQL 16 kèm sẵn extension pgvector
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: avora
      POSTGRES_PASSWORD: avora
      POSTGRES_DB: avora_matching
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avora"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Service Vector Database: Qdrant hỗ trợ Filterable HNSW và gRPC (cổng 6334)
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Service web: FastAPI app với ORJSONResponse, ONNX/FastEmbed, AsyncQdrantClient & asyncpg
  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://avora:avora@db:5432/avora_matching
      QDRANT_HOST: qdrant
      QDRANT_HTTP_PORT: "6333"
      QDRANT_GRPC_PORT: "6334"
      QDRANT_PREFER_GRPC: "true"
      EMBEDDING_MODEL_NAME: Qwen/Qwen3-Embedding-0.6B
      VECTOR_DIM: "1024"
      TOP_K_JOBS: "10"
      TOP_K_CANDIDATES: "20"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./src:/code/src
      - ./scripts:/code/scripts

volumes:
  pgdata:
  qdrant_data:
